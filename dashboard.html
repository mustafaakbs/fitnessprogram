<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Programı</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png" type="image/png">
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="header-content">
            <h1>Fitness Programı</h1>
            <div class="user-info">
                <span id="currentDateTime"></span>
                <span id="currentUser"></span>
                <button id="logoutBtn" class="action-btn">Çıkış Yap</button>
            </div>
        </div>
    </header>

    <main class="dashboard-content">
        <div class="days-container">
            <button class="day-button active" data-day="pazartesi">Pazartesi</button>
            <button class="day-button" data-day="sali">Salı</button>
            <button class="day-button" data-day="carsamba">Çarşamba</button>
            <button class="day-button" data-day="persembe">Perşembe</button>
            <button class="day-button" data-day="cuma">Cuma</button>
            <button class="day-button" data-day="cumartesi">Cumartesi</button>
            <button class="day-button" data-day="pazar">Pazar</button>
        </div>

        <div class="program-container">
            <h2 class="program-title"></h2>
            <div id="exercisesContainer"></div>
        </div>
    </main>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
