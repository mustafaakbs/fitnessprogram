<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>FITNESS PROGRAMI</h1>
        <div class="user-info">
            <span id="currentDateTime">
                Current Date and Time (UTC - YYYY-MM-DD HH:MM:SS formatted): 2025-03-03 07:50:06
            </span>
            <span id="currentUser">
                Current User's Login: mustafaakbs
            </span>
            <button id="logoutBtn">Çıkış</button>
        </div>
    </header>

    <div class="container">
        <!-- Günlerin butonları -->
        <div class="days-buttons">
            <button class="day-btn active" data-day="pazartesi">Pazartesi</button>
            <button class="day-btn" data-day="carsamba">Çarşamba</button>
            <button class="day-btn" data-day="cuma">Cuma</button>
        </div>

        <!-- Program içeriği -->
        <div id="programContainer">
            <div class="program-day active" id="pazartesi">
                <h2>Göğüs + Ön Kol</h2>
                <div class="exercises">
                    <!-- Egzersizler buraya dinamik olarak eklenecek -->
                </div>
            </div>
            <div class="program-day" id="carsamba">
                <h2>Sırt + Arka Kol</h2>
                <div class="exercises">
                    <!-- Egzersizler buraya dinamik olarak eklenecek -->
                </div>
            </div>
            <div class="program-day" id="cuma">
                <h2>Bacak</h2>
                <div class="exercises">
                    <!-- Egzersizler buraya dinamik olarak eklenecek -->
                </div>
            </div>
        </div>

        <!-- Egzersiz formu şablonu -->
        <template id="exerciseFormTemplate">
            <form class="exercise-form">
                <div class="form-group">
                    <label>Egzersiz Adı:</label>
                    <input type="text" class="exercise-name" required>
                </div>
                <div class="form-group">
                    <label>Setler:</label>
                    <div class="sets-container">
                        <input type="number" class="set-input" required>
                        <input type="number" class="set-input" required>
                        <input type="number" class="set-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ağırlık (kg):</label>
                    <input type="number" class="weight-input" required>
                </div>
                <div class="form-group">
                    <label>Video URL:</label>
                    <input type="url" class="video-url" required>
                    <div class="video-preview"></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="save-btn">Kaydet</button>
                </div>
            </form>
        </template>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="database.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
