<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>FITNESS PROGRAMI</h1>
        <div class="user-info">
            <span id="currentDateTime">
                Current Date and Time (UTC - YYYY-MM-DD HH:MM:SS formatted): 2025-03-03 08:01:44
            </span>
            <span id="currentUser">
                Current User's Login: mustafaakbs
            </span>
            <button id="logoutBtn">Çıkış</button>
        </div>
    </header>

    <div class="container">
        <!-- Günlerin butonları -->
        <div class="days-buttons">
            <button class="day-btn active" data-day="pazartesi">Pazartesi</button>
            <button class="day-btn" data-day="carsamba">Çarşamba</button>
            <button class="day-btn" data-day="cuma">Cuma</button>
        </div>

        <!-- Program içeriği -->
        <div id="programContainer">
            <div class="program-day active" id="pazartesi">
                <h2>Göğüs + Ön Kol</h2>
                <div class="exercises">
                    <!-- Egzersizler buraya dinamik olarak eklenecek -->
                </div>
            </div>
            <div class="program-day" id="carsamba">
                <h2>Sırt + Arka Kol</h2>
                <div class="exercises">
                    <!-- Egzersizler buraya dinamik olarak eklenecek -->
                </div>
            </div>
            <div class="program-day" id="cuma">
                <h2>Bacak</h2>
                <div class="exercises">
                    <!-- Egzersizler buraya dinamik olarak eklenecek -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="database.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
