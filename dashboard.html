<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="user-info">
            <pre id="currentUser"></pre>
            <button id="logoutBtn" class="action-btn">Çıkış Yap</button>
        </div>

        <div class="day-selector">
            <button class="day-button active" data-day="pazartesi">Pazartesi</button>
            <button class="day-button" data-day="sali">Salı</button>
            <button class="day-button" data-day="carsamba">Çarşamba</button>
            <button class="day-button" data-day="persembe">Perşembe</button>
            <button class="day-button" data-day="cuma">Cuma</button>
            <button class="day-button" data-day="cumartesi">Cumartesi</button>
            <button class="day-button" data-day="pazar">Pazar</button>
        </div>

        <div class="program-container">
            <h2 class="program-title"></h2>
            <div id="exercisesContainer"></div>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
