<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Program - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="dashboard-header">
        <div class="header-content">
            <h1>FITNESS PROGRAMI</h1>
            <div class="user-info">
                <span class="user-name" id="currentUser"></span>
                <span class="date-time" id="currentDateTime"></span>
                <button id="logoutBtn">Çıkış Yap</button>
            </div>
        </div>
    </header>

    <main class="dashboard-content">
        <div class="days-container">
            <!-- Günler dinamik olarak eklenecek -->
        </div>

        <div id="programCards" class="exercises-container">
            <!-- Programlar dinamik olarak eklenecek -->
        </div>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
