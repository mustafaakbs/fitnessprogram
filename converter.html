<!DOCTYPE html>
<html>
<head>
    <title>Program Dönüştürücü</title>
    <style>
        /* Önceki stiller aynı */
    </style>
</head>
<body>
    <!-- Önceki HTML yapısı aynı -->
    <script>
        function convertJsonToCsv() {
            try {
                // Excel için başlık satırları
                let csv = "Program Bilgileri\n";
                csv += "\nProgram Detayları\n";
                
                // Tarih ve kullanıcı bilgisi
                const now = new Date();
                const formattedDate = now.toLocaleDateString('tr-TR', { 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit'
                });
                const formattedTime = now.toLocaleTimeString('tr-TR', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit'
                });
                
                csv += "Tarih,Saat,Kullanıcı\n";
                csv += `${formattedDate},${formattedTime},mustafaakbs\n\n`;
                
                // Program tablosu başlıkları
                csv += "Gün,Program Adı,Egzersiz Adı,Set,Tekrar,Video Linki\n";

                // JSON verisini parse et
                const data = JSON.parse(document.getElementById('jsonInput').value);
                
                // userPrograms dizisini işle
                if (Array.isArray(data.userPrograms)) {
                    data.userPrograms.forEach((userProgram, index) => {
                        Object.entries(userProgram).forEach(([day, dayData]) => {
                            if (dayData.exercises) {
                                dayData.exercises.forEach(exercise => {
                                    exercise.sets.forEach(set => {
                                        // Her satır için Türkçe gün adını kullan
                                        const turkishDay = day.charAt(0).toUpperCase() + day.slice(1);
                                        csv += `${turkishDay},${dayData.title},${exercise.name},${set.number},${set.reps},${exercise.videoUrl}\n`;
                                    });
                                });
                            } else if (dayData.title) {
                                const turkishDay = day.charAt(0).toUpperCase() + day.slice(1);
                                csv += `${turkishDay},${dayData.title},,,,\n`;
                            }
                        });
                        
                        // Her kullanıcı arasına boş satır ekle
                        csv += "\n";
                    });
                }

                // Excel için UTF-8 BOM ekle
                const BOM = "\uFEFF";
                csv = BOM + csv;

                // Dosyayı indir
                downloadFile(csv, 'fitness_program.csv');
            } catch (error) {
                alert('Hata: ' + error.message);
            }
        }

        // CSV'den JSON'a dönüştürme fonksiyonu güncellendi
        function convertCsvToJson() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) {
                alert('Lütfen bir CSV dosyası seçin');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result.replace(/^\uFEFF/, ''); // BOM'u kaldır
                    const lines = text.split('\n');
                    
                    // Başlık bilgilerini atla ve program verilerini al
                    let dataStartIndex = 0;
                    for (let i = 0; i < lines.length; i++) {
                        if (lines[i].startsWith('Gün,Program')) {
                            dataStartIndex = i + 1;
                            break;
                        }
                    }

                    const result = { userPrograms: [{}] };
                    const currentProgram = result.userPrograms[0];

                    for (let i = dataStartIndex; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const [day, title, exerciseName, setNumber, reps, videoUrl] = line.split(',');
                        
                        if (!currentProgram[day.toLowerCase()]) {
                            currentProgram[day.toLowerCase()] = {
                                title: title,
                                exercises: []
                            };
                        }

                        if (exerciseName) {
                            let exercise = currentProgram[day.toLowerCase()].exercises.find(e => e.name === exerciseName);
                            if (!exercise) {
                                exercise = {
                                    name: exerciseName,
                                    sets: [],
                                    videoUrl: videoUrl
                                };
                                currentProgram[day.toLowerCase()].exercises.push(exercise);
                            }
                            
                            exercise.sets.push({
                                number: parseInt(setNumber),
                                reps: parseInt(reps)
                            });
                        }
                    }

                    const jsonOutput = document.getElementById('jsonOutput');
                    const formattedJson = JSON.stringify(result, null, 2);
                    jsonOutput.value = formattedJson;
                    downloadFile(formattedJson, 'program.json', 'application/json');

                } catch (error) {
                    alert('CSV Dönüştürme Hatası: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function downloadFile(content, filename, type = 'text/csv') {
            const blob = new Blob([content], { type: type + ';charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Sayfa yüklendiğinde tarih güncelleme
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
