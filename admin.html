<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Fitness Program</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="admin-header">
    <div class="header-content">
        <h1>ADMİN PANELİ</h1>
        <div class="admin-info">
            <span id="currentDateTime"></span>
            <span>Kullanıcı: <span id="currentUser"></span></span>
            <button id="logoutBtn" class="action-btn">Çıkış Yap</button>
        </div>
    </div>
</header>

    <main class="admin-content">
        <div class="admin-main">
            <div id="users-section" class="admin-section">
                <div class="section-header">
                    <h2>Kullanıcı Yönetimi</h2>
                    <button id="addUserBtn" class="action-btn add-btn">Yeni Kullanıcı Ekle</button>
                </div>
                <div class="table-container">
                    <table id="usersTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ad Soyad</th>
                                <th>Kullanıcı Adı</th>
                                <th>Şifre</th>
                                <th>Rol</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
