<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Program - Giriş</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>FITNESS PROGRAM</h1>
            <p>Kişisel antrenman programınıza hoş geldiniz</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <input type="text" id="username" required>
                <label for="username">Kullanıcı Adı</label>
            </div>
            <div class="form-group">
                <input type="password" id="password" required>
                <label for="password">Şifre</label>
            </div>
            <button type="submit" class="login-btn">Giriş Yap</button>
        </form>
    </div>
            <!-- Alt etiket -->
        <footer class="footer">
            <p>Tasarım ve Kodlama: Mustafa Akbaş</p>
        </footer>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
